# Grouped Dependabot configuration for GitHub Actions versions used by
# .github/workflows/. The `groups` block coalesces every action bump into a
# single PR when enabled; `open-pull-requests-limit: 0` currently pauses
# automatic version-update PRs.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
      include: scope
    labels:
      - dependencies
      - ci
