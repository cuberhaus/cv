name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default: read-only. The publish job escalates to contents: write.
permissions:
  contents: read

concurrency:
  group: build-cv-${{ github.ref }}
  # Cancel superseded builds on develop/PRs, but let main publishes
  # finish so we never leave a half-released state on the repo.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other variants if one fails - we want to see
      # all broken variants in a single run, not one at a time.
      fail-fast: false
      matrix:
        cv: [english, spanish, catalan]
        # Four curated presets x two photo modes x three languages = 24
        # public assets. Bits retain the existing c/e/p/s section contract.
        preset: [standard, technical, complete, concise]
        photo_mode: [photo, no-photo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compile ${{ matrix.cv }} ${{ matrix.preset }} ${{ matrix.photo_mode }} CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv_${{ matrix.cv }}.tex
          latexmk_use_xelatex: true
          # Each preset maps to existing c/e/p/s section flags. Photo mode
          # controls the conditional \photo declaration in every entry point.
          pre_compile: |
            mkdir -p build
            case "${{ matrix.preset }}" in
              standard) T=0111 ;;
              technical) T=0011 ;;
              complete) T=1111 ;;
              concise) T=0001 ;;
            esac
            PHOTO=0
            if [ "${{ matrix.photo_mode }}" = "photo" ]; then PHOTO=1; fi
            printf '\\def\\inccertifications{%s}\\def\\incextracurricular{%s}\\def\\incprojects{%s}\\def\\incskills{%s}\\def\\incphoto{%s}\n' \
              "${T:0:1}" "${T:1:1}" "${T:2:1}" "${T:3:1}" "$PHOTO" > build/flags.tex
            cat build/flags.tex
          # Preserve language-only aliases for existing consumers.
          post_compile: |
            mv "cv_${{ matrix.cv }}.pdf" "cv_${{ matrix.cv }}_${{ matrix.preset }}_${{ matrix.photo_mode }}.pdf"
            if [ "${{ matrix.preset }}" = "standard" ] && [ "${{ matrix.photo_mode }}" = "photo" ]; then
              cp "cv_${{ matrix.cv }}_${{ matrix.preset }}_${{ matrix.photo_mode }}.pdf" "cv_${{ matrix.cv }}.pdf"
            fi

      - name: Upload ${{ matrix.cv }}-${{ matrix.preset }}-${{ matrix.photo_mode }} PDF
        uses: actions/upload-artifact@v7
        with:
          name: cv-${{ matrix.cv }}-${{ matrix.preset }}-${{ matrix.photo_mode }}
          path: cv_${{ matrix.cv }}*.pdf

  build-ats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cv: [english, spanish, catalan]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compile local-only ATS ${{ matrix.cv }} CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ats_${{ matrix.cv }}.tex
          latexmk_use_xelatex: true
          pre_compile: |
            mkdir -p build
            printf '\\def\\inccertifications{0}\\def\\incextracurricular{1}\\def\\incprojects{1}\\def\\incskills{1}\\def\\incphoto{0}\n' > build/flags.tex

  publish:
    # Releases + portfolio dispatch only on merges to main (PR from develop).
    # Pushes to develop and PR events only run `build` above for validation.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all CV PDFs
        uses: actions/download-artifact@v8
        with:
          pattern: cv-*
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: |
          # Date-based tag: v2026.04.24-<shortsha>. Unique per commit so
          # each build gets its own permanent, archived release.
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y.%m.%d')
          TAG="v${DATE}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Publish PDFs to dated release (archive)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CV ${{ steps.tag.outputs.date }} (${{ steps.tag.outputs.short_sha }})
          body: |
            CV built from commit `${{ github.sha }}` on ${{ steps.tag.outputs.date }}.

            **27 PDFs**: four named presets x two photo modes x three languages
            = 24 assets, plus three back-compat aliases (`cv_english.pdf`,
            `cv_spanish.pdf`, `cv_catalan.pdf`) for the `standard_photo` PDFs.

            **Variant filename**: `cv_<language>_<preset>_<photo-mode>.pdf`.
            Presets: `standard` (skills, projects, extracurricular),
            `technical` (skills, projects), `complete` (all optional sections),
            `concise` (skills). Photo modes: `photo`, `no-photo`.
          files: cv_*.pdf
          prerelease: false
          make_latest: "false"

      - name: Delete previous "latest" tag/release so it retags this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # softprops/action-gh-release updates assets on an existing release
          # but does NOT move the underlying git tag. Without this step, the
          # `latest` release page would forever show the commit where the tag
          # was first created. Deleting the release + tag first forces it to
          # be re-created against the current ${{ github.sha }}.
          gh release delete latest --yes --cleanup-tag || true

      - name: Publish PDFs to rolling "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest CV
          body: |
            Auto-generated from the latest commit on `main`.
            Rebuilt on every push. For permanent archived versions see the
            dated releases (`v<YYYY.MM.DD>-<sha>`).

            Built from commit `${{ github.sha }}` on ${{ steps.tag.outputs.date }}.

            **27 PDFs**: 24 named preset/photo assets plus three back-compat
            language aliases pointing at the `standard_photo` build.
          files: cv_*.pdf
          prerelease: false
          make_latest: "true"

      - name: Trigger PersonalPortfolio redeploy
        env:
          PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$PORTFOLIO_DISPATCH_TOKEN" ]; then
            echo "PORTFOLIO_DISPATCH_TOKEN secret not set; skipping portfolio dispatch."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PORTFOLIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cuberhaus/PersonalPortfolio/dispatches \
            -d '{"event_type":"cv-updated"}'
